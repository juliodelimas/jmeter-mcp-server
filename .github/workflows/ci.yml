name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit + MCP protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

  test-integration:
    name: Real JMeter execution tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JMeter
        env:
          JMETER_VERSION: "5.6.3"
        run: |
          curl -sSL "https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" -o /tmp/jmeter.tgz
          tar -xzf /tmp/jmeter.tgz -C /tmp
          echo "JMETER_HOME=/tmp/apache-jmeter-${JMETER_VERSION}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run test:integration
